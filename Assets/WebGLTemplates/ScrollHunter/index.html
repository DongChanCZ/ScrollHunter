<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll Hunter</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a10;color:#e7cb87;font-family:Georgia,serif}
body{display:flex;align-items:center;justify-content:center}
#player{width:min(100vw,calc((100vh - 28px)*16/9),1920px)}
#screen{position:relative;aspect-ratio:16/9;background:#080a10}
canvas{width:100%;height:100%;display:block;outline:none}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;background:#080a10}
h1{font-size:clamp(28px,5vw,64px);font-weight:normal;letter-spacing:.08em;margin:0}
button{background:#151c25;border:1px solid #a58c53;color:#ead5ab;padding:10px 40px;cursor:pointer;font:inherit}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}
progress{width:45%;accent-color:#d1ac57;height:6px}
footer{display:flex;justify-content:space-between;align-items:center;height:28px;font:13px sans-serif;color:#aaa}
footer button{font-size:13px;padding:2px 14px}footer a{color:#bca67f}
#player:fullscreen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#080a10}
#player:fullscreen #screen{width:min(100vw,calc((100vh - 28px)*16/9),1920px)}
#player:fullscreen footer{width:min(100vw,calc((100vh - 28px)*16/9),1920px)}
</style>
</head>
<body>
<main id="player">
  <div id="screen">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Scroll Hunter game"></canvas>
    <div id="loading"><h1>Scroll Hunter</h1><button id="play" type="button">Play</button><progress id="progress" value="0" max="1" hidden></progress><span id="status" role="status"></span></div>
  </div>
  <footer><a href="CREDITS.md" target="_blank" rel="noopener">Credits</a><button id="fullscreen" type="button">Fullscreen</button></footer>
</main>
<script src="Build/{{{ LOADER_FILENAME }}}"></script>
<script>
const canvas=document.getElementById('unity-canvas'),start=document.getElementById('play'),status=document.getElementById('status'),progress=document.getElementById('progress');
document.getElementById('fullscreen').onclick=()=>{const player=document.getElementById('player');(document.fullscreenElement?document.exitFullscreen():player.requestFullscreen()).catch(()=>{});};
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('keydown',e=>{if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();});
start.onclick=async()=>{
  start.disabled=true;progress.hidden=false;status.textContent='Loading…';
  try{
    window.scrollHunter=await createUnityInstance(canvas,{
      dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl:'StreamingAssets',companyName:{{{ JSON.stringify(COMPANY_NAME) }}},productName:{{{ JSON.stringify(PRODUCT_NAME) }}},productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio:1,autoSyncPersistentDataPath:true,
      showBanner:(message,type)=>{if(type==='error'){status.textContent=message;console.error(message);}}
    },p=>{progress.value=p;status.textContent='Loading… '+Math.round(p*100)+'%';});
    document.getElementById('loading').hidden=true;document.getElementById('loading').style.display='none';canvas.focus();
  }catch(error){status.textContent='Unable to load the game. Please reload and try again.';console.error(error);}
};
</script>
</body>
</html>
