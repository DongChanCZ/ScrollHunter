<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll Hunter</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a10;color:#e7cb87;font-family:Georgia,serif}
body{display:flex;align-items:center;justify-content:center}
#player{width:min(100vw,calc((100vh - 28px)*16/9),1920px)}
#screen{position:relative;aspect-ratio:16/9;background:#080a10}
canvas{width:100%;height:100%;display:block;outline:none}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(8px,2vw,20px);background:#080a10}
h1{font-size:clamp(28px,5vw,64px);font-weight:normal;letter-spacing:.08em;margin:0}
button,select{background:#151c25;border:1px solid #a58c53;color:#ead5ab;cursor:pointer;font:inherit}
button{padding:10px 40px}
button:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:3px}
button:disabled,select:disabled{opacity:.5;cursor:wait}
.language-choice{display:flex;align-items:center;gap:12px;font:14px sans-serif}
#language{min-width:145px;padding:7px 12px;font:15px sans-serif;color-scheme:dark}
#status:empty{display:none}
#status{max-width:90%;text-align:center;font:14px sans-serif}
progress{width:45%;accent-color:#d1ac57;height:6px}
footer{display:flex;justify-content:space-between;align-items:center;height:28px;font:13px sans-serif;color:#aaa}
footer button{font-size:13px;padding:2px 14px}footer a{color:#bca67f}
#player:fullscreen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#080a10}
#player:fullscreen #screen{width:min(100vw,calc((100vh - 28px)*16/9),1920px)}
#player:fullscreen footer{width:min(100vw,calc((100vh - 28px)*16/9),1920px)}
</style>
</head>
<body>
<main id="player">
  <div id="screen">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Scroll Hunter game"></canvas>
    <div id="loading">
      <h1>Scroll Hunter</h1>
      <div class="language-choice">
        <label id="language-label" for="language">Language</label>
        <select id="language">
          <option value="0" lang="ko">한국어</option>
          <option value="1" lang="en" selected>English</option>
          <option value="2" lang="ja">日本語</option>
          <option value="3" lang="zh-Hans">简体中文</option>
          <option value="4" lang="es">Español</option>
        </select>
      </div>
      <button id="play" type="button">Play</button>
      <progress id="progress" value="0" max="1" hidden></progress>
      <span id="status" role="status"></span>
    </div>
  </div>
  <footer><a id="credits" href="CREDITS.md" target="_blank" rel="noopener">Credits</a><button id="fullscreen" type="button">Fullscreen</button></footer>
</main>
<script src="Build/{{{ LOADER_FILENAME }}}"></script>
<script>
const canvas=document.getElementById('unity-canvas'),start=document.getElementById('play'),status=document.getElementById('status'),progress=document.getElementById('progress'),language=document.getElementById('language');
const languageKey='ScrollHunter.Options.Language';
const labels=[
  {tag:'ko',language:'언어',play:'플레이',loading:'불러오는 중…',error:'게임을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.',credits:'크레딧',fullscreen:'전체화면'},
  {tag:'en',language:'Language',play:'Play',loading:'Loading…',error:'Unable to load the game. Please reload and try again.',credits:'Credits',fullscreen:'Fullscreen'},
  {tag:'ja',language:'言語',play:'プレイ',loading:'読み込み中…',error:'ゲームを読み込めませんでした。ページを再読み込みしてください。',credits:'クレジット',fullscreen:'全画面'},
  {tag:'zh-Hans',language:'语言',play:'开始',loading:'加载中…',error:'游戏加载失败，请刷新页面后重试。',credits:'制作人员',fullscreen:'全屏'},
  {tag:'es',language:'Idioma',play:'Jugar',loading:'Cargando…',error:'No se pudo cargar el juego. Recarga la página e inténtalo de nuevo.',credits:'Créditos',fullscreen:'Pantalla completa'}
];
function updateLabels(){
  const text=labels[Number(language.value)];
  document.documentElement.lang=text.tag;
  document.getElementById('language-label').textContent=text.language;
  start.textContent=text.play;
  document.getElementById('credits').textContent=text.credits;
  document.getElementById('fullscreen').textContent=text.fullscreen;
}
window.scrollHunterRememberLanguage=value=>{
  if(!Number.isInteger(value)||value<0||value>=labels.length)return;
  language.value=String(value);updateLabels();
  try{localStorage.setItem(languageKey,String(value));}catch{}
};
try{
  const saved=localStorage.getItem(languageKey);
  if(/^[0-4]$/.test(saved))language.value=saved;
}catch{}
updateLabels();
language.onchange=updateLabels;
document.getElementById('fullscreen').onclick=()=>{const player=document.getElementById('player');(document.fullscreenElement?document.exitFullscreen():player.requestFullscreen()).catch(()=>{});};
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('keydown',e=>{if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();});
start.onclick=async()=>{
  if(start.disabled)return;
  const selected=Number(language.value),text=labels[selected];
  window.scrollHunterLaunchLanguage=selected;
  window.scrollHunterRememberLanguage(selected);
  start.disabled=true;language.disabled=true;progress.hidden=false;status.textContent=text.loading;
  try{
    window.scrollHunter=await createUnityInstance(canvas,{
      dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl:'StreamingAssets',companyName:{{{ JSON.stringify(COMPANY_NAME) }}},productName:{{{ JSON.stringify(PRODUCT_NAME) }}},productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio:1,autoSyncPersistentDataPath:true,
      showBanner:(message,type)=>{if(type==='error'){status.textContent=message;console.error(message);}}
    },p=>{progress.value=p;status.textContent=text.loading+' '+Math.round(p*100)+'%';});
    document.getElementById('loading').hidden=true;document.getElementById('loading').style.display='none';canvas.focus();
  }catch(error){status.textContent=text.error;console.error(error);}
};
</script>
</body>
</html>
